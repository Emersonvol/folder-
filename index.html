<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">

    <title>Manda Trends</title>
</head>

<body>
    <header class="container-imgs">
        <div class="container-grupo1">
            <img class="container-imgs_circulo" src="./imagens/vectorSmartObj.png">
            <img class="container-imgs_MandaTreds" src="./imagens/MandaTrendsLogo.png">
            <img class="container-imgs_bolas" src="./imagens/bolinhas.png">
        </div>
        <div class="container-grupo2">
            <img class="container-imgs_mulherNuvem" src="./imagens/mulher.png">
            <img class="container-imgs_setas" src="./imagens/setasParaDireita.png" width="60">
        </div>
        <div class="container-grupo3">
            <img class="container-imgs_triagle" src="./imagens/triangle.png">
            <img class="container-imgs_NRF2020" src="./imagens/nrf2020.png">
            <img class="container-imgs_zigzag" src="./imagens/zigzag.png">
        </div>
    </header>

    <main>
        <section class="container-evento">
            <figure>
                <img src="./imagens/NRFVision.png" alt="NRF 2020: Conheça os top 5 assuntos do evento.">
                <figcaption>
                    <h2>NRF 2020: Conheça os top 5 assuntos do evento.</h2>
                    <p>O maior evento sobre varejo do mundo mostrando as tendências, oportunidades e inovações para o
                        setor.</p>
                </figcaption>
                <small>Fonte: CMO ADOBE</small>
            </figure>
        </section>

        <section class="container-noticias">
            <article>
                <figure>
                    <img src="./imagens/logoNBA.png" alt="Petição para colocar Kobe">
                    <figcaption>
                        <h2>Petição para colocar Kobe <br>Bryant no logo da NBA.</h2>
                    </figcaption>
                    <small>Fonte: Daily Mail</small>
                </figure>
            </article>
            <article>
                <figure>
                    <img src="./imagens/logoDoWhatsapGrande.png" alt="WhatsApp terá função de  pagamentos de 2020.">
                    <figcaption>
                        <h2>WhatsApp terá função de<br> pagamentos de 2020.</h2>
                    </figcaption>
                    <small>Fonte:Proxima</small>
                </figure>
            </article>
        </section>

    </main>

    <footer class="rodape">

        <img src="./imagens/logoAssinatura.png" alt="logo do manda Trends">
        <div>
            <p>Copyright &reg; Madarin.Todos os direitos reservados.<br>
                Caso não deseje nossos e-mails,por favor <a href="#">Clique aqui</a>
            </p>
        </div>
    </footer>


</body>

</html>
